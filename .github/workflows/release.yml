name: Release

# Tag-triggered releases. Pushing a `vX.Y.Z` tag is the explicit consent
# to release — the workflow builds, tests, and publishes ALL packages at
# the versions recorded in their package.json at that tag (lockstep, via
# the `fixed` group in .changeset/config.json). No publish runs on a
# plain merge to main; only a tag push triggers this workflow.
#
# Local release flow (no publish from your laptop after the one-time
# first-publish):
#   1. accumulate `.changeset/*.md` files in normal PRs
#   2. `npx changeset version`   # bumps all 6 packages + writes CHANGELOGs
#   3. commit the bump + changelogs, tag `vX.Y.Z`, push the tag
#   4. this workflow runs → build → test → `changeset publish --provenance`
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. npm verifies
# the publish came from this repo's `release.yml` workflow (register each
# package as a Trusted Publisher — see docs/tasks/release-ci-workflow).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # `changeset publish` may push git tags / release notes
  id-token: write   # REQUIRED for npm OIDC trusted publishing

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc --build — dependency-ordered, emits dist/)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish (Changesets + npm Trusted Publishing / OIDC)
        run: npx changeset publish --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # NOTE: OIDC authenticates the publish — no NPM_TOKEN / NODE_AUTH_TOKEN.
